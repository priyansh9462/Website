name: react_frontend

on:
  push:
    branches: [ "feature/webapp" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./scholr-Web/frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './scholr-Web/frontend/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Build React app
      run: npm run build
